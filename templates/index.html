<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Trading Analyzer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
  <div class="container">
    <h1>Trading Analyzer</h1>
    <form id="analyzeForm">
      <label>Ticker: <input id="ticker" name="ticker" required></label>
      <label>Tipo de análisis:
        <select id="prompt_choice" name="prompt_choice">
          <option value="1">Regresión + Sentimiento (1-4 semanas)</option>
          <option value="2">LSTM + Momentum (7-21 días)</option>
          <option value="3">Sentimiento real-time (48h)</option>
        </select>
      </label>
      <button type="submit">Analizar</button>
    </form>

    <div id="result"></div>
  </div>
  <script src="/static/js/app.js"></script>
</body>
</html>
